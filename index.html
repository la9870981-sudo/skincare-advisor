<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'M FABULOUS — Skincare Advisor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf7f2;
    --warm-white: #fff9f4;
    --gold: #b89b6a;
    --gold-light: #d4b896;
    --gold-dark: #8a7145;
    --charcoal: #1a1714;
    --text: #2d2820;
    --text-muted: #7a6e64;
    --border: #e8dfd4;
    --bubble-user: #2d2820;
    --bubble-ai: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Jost', sans-serif;
    background: transparent;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px 24px;
  }

  .intro {
    text-align: center;
    padding: 20px 16px 28px;
  }
  .intro-eyebrow {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .intro h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 300;
    color: var(--charcoal);
    line-height: 1.2;
    margin-bottom: 14px;
  }
  .intro h1 em { font-style: italic; color: var(--gold-dark); }
  .intro p {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 300;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 8px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .divider-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }

  #chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 320px;
    max-height: 480px;
  }

  .message { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .avatar.ai {
    background: var(--charcoal);
    color: var(--gold-light);
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
  }
  .avatar.user {
    background: var(--gold);
    color: white;
  }

  .bubble {
    max-width: 82%;
    padding: 14px 18px;
    border-radius: 2px;
    font-size: 14px;
    line-height: 1.7;
    font-weight: 300;
  }
  .message.ai .bubble {
    background: var(--bubble-ai);
    border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px;
    color: var(--text);
  }
  .message.user .bubble {
    background: var(--bubble-user);
    color: #f5ede3;
    border-radius: 8px 0 8px 8px;
  }

  .products-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
  }
  .product-card {
    display: flex;
    gap: 12px;
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .product-card:hover { border-color: var(--gold); }
  .product-img {
    width: 72px; height: 72px;
    object-fit: cover;
    flex-shrink: 0;
    background: #f0ebe4;
  }
  .product-info {
    flex: 1;
    padding: 10px 10px 10px 0;
    min-width: 0;
  }
  .product-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-why {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    font-weight: 300;
    margin-bottom: 6px;
  }
  .product-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .product-price {
    font-size: 13px;
    font-weight: 500;
    color: var(--gold-dark);
  }
  .shop-btn {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--charcoal);
    background: transparent;
    border: 1px solid var(--charcoal);
    padding: 4px 10px;
    text-decoration: none;
    border-radius: 20px;
    transition: all 0.2s;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
  }
  .shop-btn:hover {
    background: var(--charcoal);
    color: var(--gold-light);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip {
    font-size: 12px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: white;
    color: var(--text);
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    transition: all 0.18s;
  }
  .chip:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
    background: #fdf8f2;
  }

  .typing { display: flex; gap: 5px; padding: 4px 0; align-items: center; }
  .typing span {
    width: 7px; height: 7px;
    background: var(--gold);
    border-radius: 50%;
    animation: bounce 1.1s ease infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .input-area {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-top: 12px;
    transition: border-color 0.2s;
  }
  .input-area:focus-within { border-color: var(--gold); }
  #user-input {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--text);
    background: transparent;
    resize: none;
    min-height: 24px;
    max-height: 120px;
    line-height: 1.5;
  }
  #user-input::placeholder { color: #bdb3a8; }
  #send-btn {
    background: var(--charcoal);
    border: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #send-btn:hover { background: var(--gold-dark); }
  #send-btn svg { width: 16px; height: 16px; }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 14px;
    font-weight: 300;
  }
  .footer-note a { color: var(--gold-dark); text-decoration: none; }

  #chat-window::-webkit-scrollbar { width: 4px; }
  #chat-window::-webkit-scrollbar-track { background: transparent; }
  #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

Only include products array when recommending products. If just asking a question, omit products array or use empty array.`;

let conversationHistory = [];
let isLoading = false;

const chatWindow = document.getElementById('chat-window');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function scrollToBottom() {
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function addMessage(role, content, products = []) {
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'ai' ? 'IF' : 'You';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;

  if (products && products.length > 0) {
    const grid = document.createElement('div');
    grid.className = 'products-grid';
    products.forEach(p => {
      const prod = PRODUCTS.find(x => x.handle === p.handle);
      if (!prod) return;
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img class="product-img" src="${prod.image}" alt="${prod.title}" onerror="this.style.background='#f0ebe4'">
        <div class="product-info">
          <div class="product-name">${prod.title}</div>
          <div class="product-why">${p.why}</div>
          <div class="product-footer">
            <div class="product-price">$${prod.price % 1 === 0 ? prod.price.toFixed(0) : prod.price.toFixed(2)}</div>
            <a href="${prod.url}" target="_blank" class="shop-btn">Shop Now</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    bubble.appendChild(grid);
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  chatWindow.appendChild(div);
  scrollToBottom();
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="avatar ai">IF</div>
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  chatWindow.appendChild(div);
  scrollToBottom();
  return div;
}

function addQuickChips(chips) {
  const div = document.createElement('div');
  div.className = 'chips';
  div.id = 'quick-chips';
  chips.forEach(text => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = text;
    chip.onclick = () => {
      document.getElementById('quick-chips')?.remove();
      sendMessage(text);
    };
    div.appendChild(chip);
  });
  chatWindow.appendChild(div);
  scrollToBottom();
}

async function sendMessage(text) {
  if (isLoading || !text.trim()) return;
  document.getElementById('quick-chips')?.remove();

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  isLoading = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';

  const typing = addTyping();

  try {
    const response = await fetch('https://quiet-mud-0628.la9870981.workers.dev/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...conversationHistory
        ]
      })
    });

    const data = await response.json();
    const raw = data.choices?.[0]?.message?.content || '{}';

    let parsed;
    try {
      const clean = raw.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(clean);
    } catch {
      parsed = { message: raw, products: [] };
    }

    typing.remove();
    const msg = parsed.message || "I'd love to help — could you tell me a little more about your skin?";
    addMessage('ai', msg, parsed.products || []);
    conversationHistory.push({ role: 'assistant', content: raw });

    if (conversationHistory.length === 2) {
      addQuickChips(['Anti-aging & wrinkles', 'Dark spots & brightening', 'Hair growth', 'Sensitive skin', 'Eye area concerns']);
    }

  } catch (err) {
    typing.remove();
    addMessage('ai', "I'm having a moment — please try again shortly.");
    console.error(err);
  }

  isLoading = false;
  sendBtn.disabled = false;
}

window.addEventListener('load', () => {
  setTimeout(() => {
    addMessage('ai', "Welcome to I'M FABULOUS COSMETICS®. I'm your personal skincare advisor — tell me about your skin concerns, goals, or what you'd like to treat, and I'll curate the perfect ritual for you.");
    addQuickChips(['Anti-aging & wrinkles', 'Dark spots & brightening', 'Dry / dehydrated skin', 'Hair growth', 'Eye area concerns', 'Gift ideas']);
  }, 400);
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(userInput.value.trim());
  }
});
sendBtn.addEventListener('click', () => sendMessage(userInput.value.trim()));

userInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
